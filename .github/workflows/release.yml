name: Release

# Builds AnyFile with the giode CLI for Windows (x86-64 and ARM64, zip
# and installer), macOS (one universal app, zipped and as a disk image)
# and Linux (x86-64 and ARM64: tar.gz, .deb and .rpm) when a GitHub
# release is published, and attaches the packages to it.
#
# It also builds the store packages, kept as workflow artifacts (store-*)
# for uploading by hand rather than attached to the release: an MSIX for
# each Windows architecture, for Partner Center, and, when the Apple
# secrets are set, a Mac App Store .pkg, for Transporter.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (and attach to, when publishing)
        required: true
      publish:
        description: Attach the packages to the release
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # The giode CLI, pinned so releases build reproducibly.
  GIODE_CLI: github.com/xmhrnx/giode-cli/cmd/giode@v0.1.35-alpha.1
  # The build number (CFBundleVersion); App Store Connect wants a new
  # one for every upload.
  GIODE_BUILD: ${{ github.run_number }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The engines and the session have no GUI dependencies.
      - run: go vet ./internal/carve ./internal/cfb ./internal/detect ./internal/explore/... ./internal/install ./internal/oggopus ./internal/oodle ./internal/session ./internal/tools ./cmd/anyprobe
      - run: go test ./internal/carve ./internal/detect ./internal/install ./internal/oggopus ./internal/session ./internal/settings

  windows:
    name: Windows ${{ matrix.arch }}
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the giode CLI
        run: go install "$GIODE_CLI" && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp the version
        run: .github/scripts/stamp-version.sh
      # The runner images no longer include NSIS, which the installer needs.
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Build app and installer
        run: |
          giode doctor || true
          giode build -arch ${{ matrix.arch }} windows windows-installer
          CGO_ENABLED=0 GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/windows/anyprobe.exe ./cmd/anyprobe
      - name: Package
        run: |
          mkdir -p out pkg
          cp dist/windows/AnyFile.exe dist/windows/anyprobe.exe README.md pkg/
          (cd pkg && 7z a -tzip "../out/AnyFile-$TAG-windows-${{ matrix.arch }}.zip" . > /dev/null)
          cp dist/windows/*-setup.exe "out/AnyFile-$TAG-windows-${{ matrix.arch }}-setup.exe"
          ls -la out
      # Last, since it can clear dist/windows, and under the name reserved
      # in Partner Center, which the package's display name must match.
      - name: Build the Store package
        run: |
          # The resources the CLI compiled for AnyFile.exe would clash.
          rm -f cmd/anyfile/*.syso
          sed -i 's/^name = "AnyFile"$/name = "AnyFile File Inspector"/' giode.toml
          grep '^name =' giode.toml
          giode build -arch ${{ matrix.arch }} msix
          mkdir -p store
          cp dist/windows/*.msix "store/AnyFile-$TAG-${{ matrix.arch }}.msix"
          ls -la store
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: out/*
      # Unsigned: the Store signs it. Upload it in Partner Center.
      - uses: actions/upload-artifact@v4
        with:
          name: store-windows-${{ matrix.arch }}
          path: store/*

  linux:
    name: Linux ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Gio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev
      - name: Install the giode CLI
        run: go install "$GIODE_CLI" && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp the version
        run: .github/scripts/stamp-version.sh
      - name: Build
        run: |
          giode build linux deb rpm
          go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o dist/linux/anyprobe ./cmd/anyprobe
      - name: Package
        run: |
          mkdir -p out
          mv dist/linux/*.deb "out/AnyFile-$TAG-linux-${{ matrix.arch }}.deb"
          mv dist/linux/*.rpm "out/AnyFile-$TAG-linux-${{ matrix.arch }}.rpm"
          cp README.md dist/linux/
          mv dist/linux dist/AnyFile
          tar -C dist -czf "out/AnyFile-$TAG-linux-${{ matrix.arch }}.tar.gz" AnyFile
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: out/*

  macos:
    name: macOS universal
    needs: test
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # The download is signed with a Developer ID with this set, and
      # notarized when the GIODE_NOTARY_* secrets are set too.
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      GIODE_NOTARY_ID: ${{ secrets.GIODE_NOTARY_ID }}
      # The Mac App Store build runs only with these set.
      MACOS_STORE_CERT_BASE64: ${{ secrets.MACOS_STORE_CERT_BASE64 }}
      MACOS_INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
      MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the giode CLI
        run: go install "$GIODE_CLI" && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp the version
        run: .github/scripts/stamp-version.sh
      - name: Developer ID certificate
        if: env.MACOS_CERT_BASE64 != ''
        env:
          MACOS_CERT_PASS: ${{ secrets.MACOS_CERT_PASS }}
        run: |
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$MACOS_CERT_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          id=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$id"
          echo "MACOS_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Build
        run: |
          giode build macos
          # anyprobe as one universal binary next to the app's executable.
          # With cgo: giode's i18n has no macOS locale lookup without it.
          for a in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$a go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/anyprobe-$a" ./cmd/anyprobe
          done
          lipo -create -output dist/macos/AnyFile.app/Contents/MacOS/anyprobe dist/anyprobe-arm64 dist/anyprobe-amd64
          lipo -info dist/macos/AnyFile.app/Contents/MacOS/*
          if [ -n "$MACOS_IDENTITY" ]; then
            # Hardened runtime and a secure timestamp, as notarization needs.
            codesign --force --options runtime --timestamp --sign "$MACOS_IDENTITY" dist/macos/AnyFile.app/Contents/MacOS/anyprobe
            codesign --force --options runtime --timestamp --sign "$MACOS_IDENTITY" dist/macos/AnyFile.app
          else
            # Ad-hoc signature: arm64 binaries must be signed to launch at all.
            codesign --force --deep --sign - dist/macos/AnyFile.app
          fi
          codesign --verify --strict --verbose=2 dist/macos/AnyFile.app
      - name: Package
        env:
          GIODE_NOTARY_TEAM_ID: ${{ secrets.GIODE_NOTARY_TEAM_ID }}
          GIODE_NOTARY_PASS: ${{ secrets.GIODE_NOTARY_PASS }}
        run: |
          mkdir -p out
          notarize() {
            team=${GIODE_NOTARY_TEAM_ID:-$(echo "$MACOS_IDENTITY" | grep -o '([A-Z0-9]*)$' | tr -d '()')}
            xcrun notarytool submit "$1" --apple-id "$GIODE_NOTARY_ID" --team-id "$team" --password "$GIODE_NOTARY_PASS" --wait --timeout 30m
          }
          ditto -c -k --keepParent dist/macos/AnyFile.app "out/AnyFile-$TAG-macos-universal.zip"
          if [ -n "$MACOS_IDENTITY" ] && [ -n "$GIODE_NOTARY_ID" ]; then
            # Notarize the app, then staple the ticket so it opens offline.
            notarize "out/AnyFile-$TAG-macos-universal.zip"
            xcrun stapler staple dist/macos/AnyFile.app
            rm "out/AnyFile-$TAG-macos-universal.zip"
            ditto -c -k --keepParent dist/macos/AnyFile.app "out/AnyFile-$TAG-macos-universal.zip"
          fi
          # The disk image is made here rather than by giode build dmg,
          # which builds the app again without anyprobe and the signature.
          mkdir dmg && ditto dist/macos/AnyFile.app dmg/AnyFile.app && ln -s /Applications dmg/Applications
          dmg="out/AnyFile-$TAG-macos-universal.dmg"
          hdiutil create -volname AnyFile -srcfolder dmg -ov -format UDZO "$dmg"
          if [ -n "$MACOS_IDENTITY" ]; then
            # Notarizing can outlast the keychain's lock timer; codesign
            # then waits forever for a password.
            security unlock-keychain -p ci build.keychain
            codesign --force --timestamp --sign "$MACOS_IDENTITY" "$dmg"
            if [ -n "$GIODE_NOTARY_ID" ]; then
              notarize "$dmg"
              xcrun stapler staple "$dmg"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: out/*
      - name: Mac App Store certificates and profile
        if: env.MACOS_STORE_CERT_BASE64 != '' && env.MACOS_INSTALLER_CERT_BASE64 != '' && env.MACOS_PROFILE_BASE64 != ''
        env:
          MACOS_STORE_CERT_PASS: ${{ secrets.MACOS_STORE_CERT_PASS }}
          MACOS_INSTALLER_CERT_PASS: ${{ secrets.MACOS_INSTALLER_CERT_PASS }}
        run: |
          if ! security list-keychains -d user | grep -q build.keychain; then
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          fi
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$MACOS_STORE_CERT_BASE64" | base64 -d > store.p12
          echo "$MACOS_INSTALLER_CERT_BASE64" | base64 -d > installer.p12
          security import store.p12 -k build.keychain -P "$MACOS_STORE_CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import installer.p12 -k build.keychain -P "$MACOS_INSTALLER_CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm store.p12 installer.p12
          echo "$MACOS_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/store.provisionprofile"
          echo "GIODE_MACOS_STORE_PROFILE=$RUNNER_TEMP/store.provisionprofile" >> "$GITHUB_ENV"
      # Sandboxed, with only the built-in engines, and without anyprobe.
      - name: Build for the Mac App Store
        if: env.GIODE_MACOS_STORE_PROFILE != ''
        run: |
          giode build mas
          mkdir -p store
          cp dist/macos/appstore/*.pkg "store/AnyFile-$TAG-macos-appstore.pkg"
      - uses: actions/upload-artifact@v4
        if: env.GIODE_MACOS_STORE_PROFILE != ''
        with:
          name: store-macos
          path: store/*

  publish:
    name: Attach to release
    needs: [windows, linux, macos]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
